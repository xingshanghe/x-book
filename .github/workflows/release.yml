name: release

# 触发方式：
#   1) 推送 tag（推荐）： git tag v1.0.0 && git push origin v1.0.0
#   2) 手动： Actions → release → Run workflow（可选是否发布 Release、是否构建 HarmonyOS）
#
# 产物：macOS(dmg/app) · Windows(nsis/msi) · Linux(deb/appimage) · Android(apk/aab) · iOS(ipa/app) · Web(zip)
# 全部资产会上传到同一个 Release；未配置签名密钥时退化为可安装的调试包。
#
# 结构说明：prepare 作业先建「草稿 Release」，后续作业只做「上传资产」，
# 避免多个作业并发争抢创建 Release 导致的 422 Release already exists；
# 最后 finalize 把草稿转正。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true
      build_harmony:
        description: '是否在 CI 上尝试 HarmonyOS 作业（需 DevEco SDK，通常跳过）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  # 必须与 package.json 的 packageManager / pnpm-lock.yaml 的 lockfileVersion 保持一致
  PNPM_VERSION: 8.15.9
  RUST_TOOLCHAIN: stable
  TAG: ${{ github.ref_name }}

jobs:
  # ───────────────────────── 草稿 Release（唯一创建者） ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: 创建草稿 Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const publish = '${{ github.event_name }}' !== 'workflow_dispatch' || '${{ inputs.publish }}' !== 'false';
            core.setOutput('publish', String(publish));

            // workflow_dispatch 且选择「不发布」时，跳过后续所有资产上传
            if (!publish) {
              core.setOutput('release_id', '');
              core.setOutput('upload_url', '');
              core.info('本次为手动构建，不发布 Release');
              return;
            }

            // tag push 触发时 tag 一定存在；workflow_dispatch 时可能尚未创建
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`已存在 Release #${release.data.id}`);
            } catch {
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `轻阅 ${tag}`,
                body: [
                  '## 轻阅 QINGYUE',
                  '',
                  '本地优先的纯离线 txt 阅读器：流式分块解析，百万字大书秒开；',
                  '导入、书架、阅读、排版、书签、进度全部离线可用。',
                  '',
                  '## 下载对应你平台的安装包',
                  '',
                  '| 平台 | 推荐产物 | 说明 |',
                  '| --- | --- | --- |',
                  '| macOS | `qingyue-<tag>-macos-universal.dmg` | Intel / Apple Silicon 通用 |',
                  '| Windows | `qingyue-<tag>-windows-x86_64-setup.exe` | NSIS 安装器 |',
                  '| Linux | `qingyue-<tag>-linux-x86_64.AppImage` | 免安装，chmod +x 后直接运行 |',
                  '| Android | `qingyue-<tag>-android-universal.apk` | 未签名时可先装 debug 版本 |',
                  '| iOS | `qingyue-<tag>-ios-unsigned.zip` | 未签名 .app，需自签或走 TestFlight |',
                  '| 任意浏览器 | `qingyue-web-<tag>.zip` | 解压后用静态服务器打开即可离线运行 |',
                  '| HarmonyOS | `qingyue-<tag>-harmony-unsigned.app` | 需本地 DevEco Studio 产出 |',
                  '',
                  '> HarmonyOS 官方 runner 无 SDK；请在本地 DevEco Studio 打开 `harmony/` → ',
                  '> Build > Build APP(s)，再用 `gh release upload <tag>` 挂载产物。'
                ].join('\n'),
                draft: true,
                prerelease: false
              });
              core.info(`已创建草稿 Release #${release.data.id}`);
            }
            core.setOutput('release_id', String(release.data.id));
            core.setOutput('upload_url', release.data.upload_url);

  # ───────────────────────── 桌面三端 ─────────────────────────
  desktop:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            slug: macos-universal
            target: universal-apple-darwin
            bundles: dmg,app
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            slug: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            rust_targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            slug: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 不使用 pnpm/action-setup：避免其自带的 pnpm 版本与 packageManager / lockfileVersion 冲突
      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        run: |
          npm install -g pnpm@$PNPM_VERSION
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建 ${{ matrix.label }} 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # .app / AppImage 这类「目录型」或需保留权限的产物统一打成 zip；单文件安装包直接上传
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifacts
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -R "$BUNDLE" || true
          # 单文件：dmg / exe / msi / deb / AppImage
          find "$BUNDLE" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} artifacts/ \; 2>/dev/null || true
          # 目录型：*.app
          for app in $(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -type d 2>/dev/null); do
            (cd "$BUNDLE/macos" && zip -r -y -q "$GITHUB_WORKSPACE/artifacts/qingyue-${TAG}-${{ matrix.slug }}-app.zip" "$(basename "$app")")
          done
          ls -la artifacts

      - name: 上传 ${{ matrix.label }} 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Android ─────────────────────────
  android:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        run: |
          npm install -g pnpm@$PNPM_VERSION
          pnpm --version

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 Rust Android 目标
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 初始化 Android 工程
        run: pnpm exec tauri android init

      - name: 配置签名（可选）
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "SIGNING_CONFIGURED=true"
          } >> $GITHUB_ENV

      - name: 构建 APK / AAB
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            pnpm exec tauri android build --apk --aab --split-per-abi
          else
            pnpm exec tauri android build --apk --split-per-abi --debug
          fi

      - name: 整理产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} artifacts/ \; 2>/dev/null || true
          # 重命名为带版本的可识别文件名
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            mv "$f" "artifacts/qingyue-${TAG}-android-${base}" 2>/dev/null || true
          done
          ls -la artifacts

      - name: 上传 Android 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── iOS ─────────────────────────
  ios:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        run: |
          npm install -g pnpm@$PNPM_VERSION
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 初始化 iOS 工程
        run: pnpm exec tauri ios init

      - name: 构建 iOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            pnpm exec tauri ios build --export-method app-store-connect --ci
          else
            echo "::warning::未配置 iOS 签名信息，导出未签名 .app"
            pnpm exec tauri ios build --ci --debug
          fi

      - name: 整理产物
        run: |
          mkdir -p artifacts
          if compgen -G "src-tauri/gen/apple/build/**/*.ipa" > /dev/null; then
            find src-tauri/gen/apple/build -name '*.ipa' -type f -exec cp {} artifacts/qingyue-${TAG}-ios.ipa \; 2>/dev/null || true
          fi
          APP_DIR=$(find src-tauri/gen/apple/build -maxdepth 6 -type d -name '*.app' | head -n 1)
          if [ -n "$APP_DIR" ]; then
            (cd "$(dirname "$APP_DIR")" && zip -r -y -q "$GITHUB_WORKSPACE/artifacts/qingyue-${TAG}-ios-unsigned.zip" "$(basename "$APP_DIR")")
          else
            echo "::warning::未找到 iOS .app 产物"
          fi
          ls -la artifacts

      - name: 上传 iOS 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Web(离线 PWA) ─────────────────────────
  web:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        run: |
          npm install -g pnpm@$PNPM_VERSION
          pnpm --version

      - name: 安装依赖并构建
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: 打包 dist
        run: cd dist && zip -r "../qingyue-web-${TAG}.zip" .

      - name: 上传 Web 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: qingyue-web-${{ env.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── HarmonyOS ─────────────────────────
  # GitHub 官方 runner 没有 HarmonyOS SDK，ArkTS 必须在装了 DevEco Studio 的机器上编译。
  # 默认不跑；本地构建出 .app 后用下面命令挂到 Release：
  #   gh release upload <tag> harmony/entry/build/default/outputs/default/*.app
  harmony:
    needs: prepare
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_harmony }}
    runs-on: macos-latest
    steps:
      - name: 提示
        run: |
          echo "::warning::HarmonyOS 需要 DevEco Studio / HarmonyOS SDK，无法在 GitHub runner 上编译。"
          echo "请在本地执行："
          echo "  pnpm build && pnpm sync:harmony"
          echo "  # DevEco Studio 打开 harmony/ 目录 → Build APP(s)"
          echo "  gh release upload ${TAG} harmony/entry/build/default/outputs/default/*.app"

  # ───────────────────────── 草稿转正 ─────────────────────────
  finalize:
    needs: [prepare, desktop, android, ios, web]
    if: ${{ always() && needs.prepare.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(${{ needs.prepare.outputs.release_id }}),
              draft: false
            });
            core.info('Release 已发布：https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/' + process.env.TAG);
