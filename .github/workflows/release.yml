name: release

# 触发方式：
#   1) 推送 tag（推荐）： git tag v1.0.0 && git push origin v1.0.0
#   2) 手动： Actions → release → Run workflow（可选是否发布到 Release）
#
# 产物：macOS(dmg/app) · Windows(nsis/msi) · Linux(deb/appimage) · Android(apk/aab) · iOS(ipa/app)
# 全部产物会自动上传到同一个 Release；未配置签名密钥时退化为可安装的调试包。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10
  RUST_TOOLCHAIN: stable

jobs:
  # ───────────────────────── 桌面三端 ─────────────────────────
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: universal-apple-darwin
            bundles: --bundles dmg,app
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            bundles: --bundles nsis,msi
            rust_targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
            bundles: --bundles deb,appimage
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: macOS 代码签名（可选）
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions temp-app.keychain
          security set-keychain-settings -lut 21600 temp-app.keychain
          security unlock-keychain -p actions temp-app.keychain
          security import certificate.p12 -k temp-app.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp-app.keychain
          security list-keychain -d user -s temp-app.keychain

      - name: 构建 ${{ matrix.label }} 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./
          tagName: ${{ github.ref_name }}
          releaseName: 轻阅 ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # 手动触发且选择不发布时，只构建不上传
          uploadAssets: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          # 本项目未引入 tauri-plugin-updater，更新器是「可选增强」，不产 updater 清单
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}

  # ───────────────────────── Android ─────────────────────────
  android:
    # tauri-action 已经在 desktop 作业里创建了 Release，softprops 需要它先存在
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 Rust Android 目标
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: 初始化 Android 工程
        run: pnpm exec tauri android init

      - name: 配置签名（可选）
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV

      - name: 构建 APK / AAB
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            pnpm exec tauri android build --apk --aab --split-per-abi
          else
            # 无签名密钥：产出调试签名 APK（可直接安装），用于自测分发
            pnpm exec tauri android build --apk --split-per-abi --debug
          fi

      - name: 上传 Android 产物
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── iOS ─────────────────────────
  ios:
    needs: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 初始化 iOS 工程
        run: pnpm exec tauri ios init

      - name: 构建 iOS
        # 配置了证书与描述文件时导出 ipa；否则退化为未签名的 .app（仅模拟器/越狱安装）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            pnpm exec tauri ios build --export-method app-store-connect --ci
          else
            echo "::warning::未配置 iOS 签名信息，导出未签名 .app"
            pnpm exec tauri ios build --ci --debug
          fi

      - name: 上传 iOS 产物
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Web(离线 PWA) 压缩包 ─────────────────────────
  web:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖并构建
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: 打包 dist
        run: cd dist && zip -r ../qingyue-web-${{ github.ref_name }}.zip .

      - name: 上传 Web 产物
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        with:
          tag_name: ${{ github.ref_name }}
          files: qingyue-web-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── HarmonyOS ─────────────────────────
  # GitHub 官方 runner 没有 HarmonyOS SDK，ArkTS 必须在装了 DevEco Studio
  # 的机器上编译。默认不跑；本地构建出 .app 后用下面这步把它挂到 Release：
  #   1) DevEco Studio 打开 harmony/ → Build > Build Hap(s)/APP(s) > Build APP(s)
  #   2) gh release upload v1.0.0 harmony/entry/build/default/outputs/**/*.app
  harmony:
    needs: desktop
    if: github.event_name == 'workflow_dispatch' && inputs.build_harmony
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提示
        run: |
          echo "::warning::HarmonyOS 需要 DevEco Studio / HarmonyOS SDK，无法在 GitHub runner 上编译。"
          echo "请在本地执行："
          echo "  pnpm build && node scripts/build-harmony-assets.mjs"
          echo "  # DevEco Studio 打开 harmony/ 目录 → Build APP(s)"
          echo "  gh release upload ${{ github.ref_name }} harmony/entry/build/default/outputs/default/*.app"
