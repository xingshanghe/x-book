name: release

# 触发方式：
#   1) 推送 tag（推荐）： git tag v1.0.0 && git push origin v1.0.0
#   2) 手动： Actions → release → Run workflow（可选是否发布 Release、是否构建 HarmonyOS）
#
# 产物：macOS(dmg/app) · Windows(nsis) · Linux(deb/appimage) · Android(apk) · iOS(app/ipa) · Web(zip)
# 全部资产会上传到同一个 Release；未配置签名密钥时退化为可安装的调试包。
#
# 结构说明：prepare 作业先建好 Release（唯一创建者），后续作业只做「上传资产」，
# 避免多个作业并发争抢创建 Release 导致的 422 Release already exists；
# finalize 只输出汇总。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个 tag（留空=当前分支名；填 v1.0.1 会按该 tag 创建 Release）'
        type: string
        required: false
        default: ''
      publish:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true
      build_harmony:
        description: '是否在 CI 上尝试 HarmonyOS 作业（需 DevEco SDK，通常跳过）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  # 必须与 package.json 的 packageManager / pnpm-lock.yaml 的 lockfileVersion 保持一致
  PNPM_VERSION: 8.15.9
  RUST_TOOLCHAIN: stable
  # tag push → ref_name 就是 tag 名；workflow_dispatch → 优先用输入的 tag，否则退回分支名
  TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  # ───────────────────────── 创建 Release（唯一创建者） ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: 创建 Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const publish = '${{ github.event_name }}' !== 'workflow_dispatch' || '${{ inputs.publish }}' !== 'false';
            core.setOutput('publish', String(publish));

            // workflow_dispatch 且选择「不发布」时，跳过后续所有资产上传
            if (!publish) {
              core.setOutput('release_id', '');
              core.setOutput('upload_url', '');
              core.info('本次为手动构建，不发布 Release');
              return;
            }

            // tag push 触发时 tag 一定存在；workflow_dispatch 时可能尚未创建
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`已存在 Release #${release.data.id}`);
            } catch {
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `轻阅 ${tag}`,
                body: [
                  '## 轻阅 QINGYUE',
                  '',
                  '本地优先的纯离线 txt 阅读器：流式分块解析，百万字大书秒开；',
                  '导入、书架、阅读、排版、书签、进度全部离线可用。',
                  '',
                  '## 下载对应你平台的安装包',
                  '',
                  '| 平台 | 推荐产物 | 说明 |',
                  '| --- | --- | --- |',
                  '| macOS | `qingyue-<tag>-macos-universal.dmg` | Intel / Apple Silicon 通用 |',
                  '| Windows | `qingyue-<tag>-windows-x86_64-setup.exe` | NSIS 安装器 |',
                  '| Linux | `qingyue-<tag>-linux-x86_64.AppImage` | 免安装，chmod +x 后直接运行 |',
                  '| Android | `qingyue-<tag>-android-universal.apk` | 未签名时可先装 debug 版本 |',
                  '| iOS | `qingyue-<tag>-ios-unsigned.zip` | 未签名 .app，需自签或走 TestFlight |',
                  '| 任意浏览器 | `qingyue-web-<tag>.zip` | 解压后用静态服务器打开即可离线运行 |',
                  '| HarmonyOS | `qingyue-<tag>-harmony-unsigned.app` | 需本地 DevEco Studio 产出 |',
                  '',
                  '> HarmonyOS 官方 runner 无 SDK；请在本地 DevEco Studio 打开 `harmony/` → ',
                  '> Build > Build APP(s)，再用 `gh release upload <tag>` 挂载产物。'
                ].join('\n'),
                draft: false,
                prerelease: false
              });
              core.info(`已创建草稿 Release #${release.data.id}`);
            }
            core.setOutput('release_id', String(release.data.id));
            core.setOutput('upload_url', release.data.upload_url);

  # ───────────────────────── 桌面三端 ─────────────────────────
  desktop:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            slug: macos-universal
            target: universal-apple-darwin
            bundles: dmg,app
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            slug: windows-x86_64
            # 不出 msi：Tauri 的 MSI 依赖 WiX v3 工具集，GitHub runner 上未预装且需 .NET 3.5，必然失败
            bundles: nsis
            rust_targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            slug: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 不使用 pnpm/action-setup：避免其自带的 pnpm 版本与 packageManager / lockfileVersion 冲突
      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        # Windows runner 默认 shell 是 pwsh，必须显式用 bash 才能拿到 $PNPM_VERSION
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建 ${{ matrix.label }} 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # .app 这类「目录型」产物打成 zip；单文件安装包直接上传。
      # 用 bash glob 而不是 find：Windows runner 的 PATH 里也有个 C:\Windows\System32\find.exe，
      # shell: bash 下容易踩到非 GNU 版本导致参数报错
      - name: 整理产物
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p artifacts
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -R "$BUNDLE" || true
          # 单文件：dmg / exe / deb / AppImage
          for f in "$BUNDLE"/*/*.dmg "$BUNDLE"/*/*.exe "$BUNDLE"/*/*.deb "$BUNDLE"/*/*.AppImage; do
            cp -v "$f" artifacts/
          done
          # 目录型：*.app（仅 macOS 产物）
          for app in "$BUNDLE"/macos/*.app; do
            (cd "$(dirname "$app")" && zip -r -y -q "$GITHUB_WORKSPACE/artifacts/qingyue-${TAG}-${{ matrix.slug }}-app.zip" "$(basename "$app")")
          done
          ls -la artifacts

      - name: 上传 ${{ matrix.label }} 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Android ─────────────────────────
  android:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        # Windows runner 默认 shell 是 pwsh，必须显式用 bash 才能拿到 $PNPM_VERSION
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm --version

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 镜像已内置 Android SDK（ANDROID_HOME），但 sdkmanager 不一定在 PATH 里：
      # 旧镜像在 cmdline-tools/latest/bin，新镜像可能只有 cmdline-tools/bin。
      # 之前「配置 Android SDK 与 NDK」步骤 exit 127 就是因为裸调 sdkmanager 找不到命令。
      # 这里探测一次并写进 GITHUB_ENV / GITHUB_PATH，后续步骤统一用 $SDKMANAGER。
      - name: 定位 Android SDK
        id: sdk
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/bin" "$SDK/tools/bin"; do
            if [ -x "$d/sdkmanager" ]; then
              SDKMANAGER="$d/sdkmanager"
              echo "$d" >> "$GITHUB_PATH"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager，SDK 目录内容如下"
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: 接受 SDK licenses
        shell: bash
        continue-on-error: true
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: 安装平台与构建工具
        shell: bash
        run: |
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装 NDK 26.3
        shell: bash
        run: |
          "$SDKMANAGER" --install "ndk;26.3.11579264"
          ls "$ANDROID_HOME/ndk" || true
          test -d "$ANDROID_HOME/ndk/26.3.11579264" || { echo "::error::NDK 未安装成功"; exit 1; }
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: 安装 Rust Android 目标
        run: rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 初始化 Android 工程
        env:
          CI: true
        run: pnpm exec tauri android init

      # secrets 不能用于 step 级 if，只能在 shell 里判断；之前写成 if: env.KEYSTORE != '' 永远为假
      - name: 配置签名（可选）
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，将构建可安装的 debug APK"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_CONFIGURED=true"
          } >> "$GITHUB_ENV"

      - name: 构建 APK / AAB
        shell: bash
        env:
          CI: true
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            pnpm exec tauri android build --apk --aab --split-per-abi
          else
            pnpm exec tauri android build --apk --split-per-abi --debug
          fi

      - name: 整理产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} artifacts/ \; 2>/dev/null || true
          # 重命名为带版本的可识别文件名
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            mv "$f" "artifacts/qingyue-${TAG}-android-${base}" 2>/dev/null || true
          done
          ls -la artifacts

      - name: 上传 Android 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── iOS ─────────────────────────
  ios:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        # Windows runner 默认 shell 是 pwsh，必须显式用 bash 才能拿到 $PNPM_VERSION
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 初始化 iOS 工程
        run: pnpm exec tauri ios init

      - name: 构建 iOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            pnpm exec tauri ios build --export-method app-store-connect --ci
          else
            echo "::warning::未配置 iOS 签名信息，产出未签名 .app（无证书时导出 IPA 必然失败）"
            pnpm exec tauri ios build --ci --no-sign --archive-only --target aarch64
          fi

      - name: 整理产物
        run: |
          mkdir -p artifacts
          if compgen -G "src-tauri/gen/apple/build/**/*.ipa" > /dev/null; then
            find src-tauri/gen/apple/build -name '*.ipa' -type f -exec cp {} artifacts/qingyue-${TAG}-ios.ipa \; 2>/dev/null || true
          fi
          # .app 可能在 xcarchive 内（无签名 archive-only 路径），不限制深度
          APP_DIR=$(find src-tauri/gen/apple/build -type d -name '*.app' 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ]; then
            (cd "$(dirname "$APP_DIR")" && zip -r -y -q "$GITHUB_WORKSPACE/artifacts/qingyue-${TAG}-ios-unsigned.zip" "$(basename "$APP_DIR")")
          else
            echo "::warning::未找到 iOS .app 产物"
          fi
          ls -la artifacts

      - name: 上传 iOS 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Web(离线 PWA) ─────────────────────────
  web:
    needs: prepare
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm ${{ env.PNPM_VERSION }}
        # Windows runner 默认 shell 是 pwsh，必须显式用 bash 才能拿到 $PNPM_VERSION
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          pnpm --version

      - name: 安装依赖并构建
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: 打包 dist
        run: cd dist && zip -r "../qingyue-web-${TAG}.zip" .

      - name: 上传 Web 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: qingyue-web-${{ env.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── HarmonyOS ─────────────────────────
  # GitHub 官方 runner 没有 HarmonyOS SDK，ArkTS 必须在装了 DevEco Studio 的机器上编译。
  # 默认不跑；本地构建出 .app 后用下面命令挂到 Release：
  #   gh release upload <tag> harmony/entry/build/default/outputs/default/*.app
  harmony:
    needs: prepare
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_harmony }}
    runs-on: macos-latest
    steps:
      - name: 提示
        run: |
          echo "::warning::HarmonyOS 需要 DevEco Studio / HarmonyOS SDK，无法在 GitHub runner 上编译。"
          echo "请在本地执行："
          echo "  pnpm build && pnpm sync:harmony"
          echo "  # DevEco Studio 打开 harmony/ 目录 → Build APP(s)"
          echo "  gh release upload ${TAG} harmony/entry/build/default/outputs/default/*.app"

  # ───────────────────────── 完成提示 ─────────────────────────
  # prepare 已直接创建为正式 Release（draft:false），这里只在结束时给出链接与作业结果摘要
  finalize:
    needs: [prepare, desktop, android, ios, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "## 轻阅 ${TAG} 构建汇总" >> $GITHUB_STEP_SUMMARY
          echo "Release： https://github.com/$GITHUB_REPOSITORY/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$NEEDS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
