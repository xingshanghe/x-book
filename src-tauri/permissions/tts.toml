[[permission]]
identifier = "allow-tts-host"
description = "读取本机系统和处理器，用来选择朗读引擎。"
commands.allow = ["tts_host"]

[[permission]]
identifier = "allow-tts-download-engine"
description = "确认后把朗读引擎下载到应用数据目录。"
commands.allow = ["tts_download_engine"]

[[permission]]
identifier = "allow-tts-cancel-download"
description = "取消正在进行的朗读引擎下载，已下载的部分保留。"
commands.allow = ["tts_cancel_download"]

[[permission]]
identifier = "allow-tts-delete-engine"
description = "删除已下载的朗读引擎。"
commands.allow = ["tts_delete_engine"]

[[permission]]
identifier = "allow-tts-speak"
description = "用本机引擎合成一句。"
commands.allow = ["tts_speak"]

[[permission]]
identifier = "allow-account-http"
description = "由本机代替窗口访问账号服务。"
commands.allow = ["account_http"]
