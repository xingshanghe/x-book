# 站点容器内部的 nginx：只负责把静态文件发出去。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # 供 compose / 外部探活使用。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 带 hash 的构建产物可以长缓存。
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 安装包（宿主挂载的只读目录）。文件名带版本号，可长期缓存。
    location /download/ {
        types {
            application/vnd.android.package-archive apk;
            application/x-apple-diskimage           dmg;
            application/vnd.debian.binary-package   deb;
            application/x-msdownload                exe;
            application/zip                         zip;
            application/octet-stream                AppImage;
            application/json                        json;
            text/plain                              txt;
        }
        default_type application/octet-stream;
        expires 30d;
        try_files $uri =404;
    }

    # 下载清单要能及时更新。
    location = /download/latest.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }
}
