services:
  enroll:
    build: .
    image: qingyue-enroll:latest
    container_name: qingyue-enroll
    restart: unless-stopped
    ports:
      - "80:8787"
    env_file: .env
    environment:
      ENROLL_SITE_DIR: /www
    volumes:
      - enroll-data:/data
      - /opt/qingyue-tts:/tts:ro
      - /opt/qingyue-www:/www:ro

volumes:
  enroll-data:
